version: '3.8'
services:
  postgresql:
    image: docker.io/bitnami/postgresql:latest
    container_name: keycloak-postgresql
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_USERNAME=bn_keycloak
      - POSTGRESQL_PASSWORD=bitnami_keycloak_password
      - POSTGRESQL_DATABASE=bitnami_keycloak
    volumes:
      - 'postgresql_data:/bitnami/postgresql'
    networks:
      - keycloak-network

  keycloak:
    image: docker.io/bitnami/keycloak:latest
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_DATABASE_VENDOR=postgresql
      - KEYCLOAK_DATABASE_HOST=keycloak-postgresql
      - KEYCLOAK_DATABASE_PORT=5432
      - KEYCLOAK_DATABASE_USER=bn_keycloak
      - KEYCLOAK_DATABASE_PASSWORD=bitnami_keycloak_password
      - KEYCLOAK_DATABASE_NAME=bitnami_keycloak
      - KEYCLOAK_CREATE_ADMIN_USER=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin_password
    depends_on:
      - postgresql
    volumes:
      - 'keycloak_data:/bitnami/keycloak'
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/master/console/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  keycloak-config:
    build:
      context: ./keycloak/scripts
    container_name: keycloak-config
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/scripts:/scripts
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - keycloak-network

  # Uncomment and configure backend service as needed
  # backend:
  #   build: ./backend
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     KEYCLOAK_SERVER_URL: http://keycloak:8080
  #     KEYCLOAK_REALM_NAME: myrealm
  #     KEYCLOAK_CLIENT_ID: client-api
  #   depends_on:
  #     - keycloak
  #   networks:
  #     - keycloak-network

  # Uncomment and configure frontend service as needed
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     VITE_KEYCLOAK_URL: http://keycloak:8080
  #     VITE_KEYCLOAK_REALM: myrealm
  #     VITE_KEYCLOAK_CLIENT: client-web
  #   depends_on:
  #     - keycloak
  #   networks:
  #     - keycloak-network

volumes:
  postgresql_data:
    driver: local
  keycloak_data:
    driver: local

networks:
  keycloak-network:
    driver: bridge
